server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers ────────────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none';" always;

  # index.html must never be cached: it names the hashed asset files, so a
  # stale copy points at bundles that no longer exist after a deploy and the
  # app fails in confusing ways.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
  location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
