<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#f4f7fb"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>NoNote</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="application-name" content="NoNote"/>
  <meta name="apple-mobile-web-app-title" content="NoNote"/>
  <!-- iOS PWA chrome color -->
  <link rel="apple-touch-icon" href="/icon-192.png"/>
  <!-- Fonts: system stack only — no external requests (homelab/offline safe) -->
  <style>
    :root {
      /* ── Arctic theme defaults (overridden by ThemeProvider) ── */
      --bg:#f4f7fb; --bg2:#ffffff; --bg3:#e8eef6;
      --border:#e2e8f0; --border2:#eef2f8;
      --text:#1e293b; --text2:#475569; --text3:#94a3b8; --text4:#cbd5e1;
      --accent:#3b82f6; --accent2:#2563eb;
      --success:#10b981; --danger:#ef4444; --warn:#f59e0b;
      --canvas-dot:#c8d8ee; --node-bg:#ffffff; --shadow:rgba(15,23,42,0.08);

      /* ── Clean skin defaults (overridden by SkinProvider) ── */
      --font-ui: 'Inter','Segoe UI Variable',system-ui,-apple-system,sans-serif;
      --font-node: 'Inter',system-ui,sans-serif;
      --font-mono: ui-monospace,'Cascadia Code','Fira Code',Consolas,monospace;
      --font-weight-ui: 500;
      --font-weight-node: 600;
      --letter-space: 0.01em;
      --line-height: 1.6;
      --app-font-size: 13px;

      /* ── Spacing — 8px grid ── */
      --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px;

      /* ── Radii ── */
      --radius-xs:5px; --radius-sm:8px; --radius-md:12px;
      --radius-lg:16px; --radius-node:12px; --radius-btn:8px;

      /* ── Layout ── */
      --topbar-h:80px; --node-header-h:48px;
      --node-pad:10px 12px; --node-body-pad:6px 12px 10px;
      --node-border-w:1px; --btn-pad:6px 12px;
      --sidebar-w:184px; --props-w:280px;
      --topbar-bg:var(--bg2); --topbar-border:1px solid var(--border);
      --topbar-blur:none; --sidebar-bg:var(--bg2);
      --sidebar-border:1px solid var(--border);

      /* ── Shadows (light mode defaults) ── */
      --shadow-node: 0 1px 3px rgba(15,23,42,0.08), 0 4px 16px rgba(15,23,42,0.06), 0 0 0 1px rgba(15,23,42,0.04);
      --shadow-node-hover: 0 3px 8px rgba(15,23,42,0.12), 0 8px 28px rgba(15,23,42,0.1);
      --shadow-node-sel: 0 0 0 2px #3b82f6, 0 0 16px rgba(59,130,246,0.15), 0 8px 32px rgba(15,23,42,0.12);
      --shadow-panel: 0 4px 24px rgba(15,23,42,0.1), 0 0 0 1px rgba(15,23,42,0.05);

      /* ── Motion ── */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --t-fast:120ms; --t-mid:180ms; --t-slow:280ms;
      --transition-all: all 0.14s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body, #root { height:100%; width:100%; overflow:hidden; }
    body {
      background:var(--bg); color:var(--text);
      font-family:var(--font-ui);
      font-size:var(--app-font-size);
      line-height:var(--line-height);
      letter-spacing:var(--letter-space);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--text4); }

    /* ── Base elements ── */
    input, textarea, button, select { font-family:var(--font-ui); }
    button { transition:var(--transition-all); cursor:pointer; }
    button:active:not(:disabled) { transform:scale(0.96); }
    button:disabled { opacity:0.35; cursor:not-allowed !important; }

    /* ── Node card lift on hover ── */
    .nn-node {
      transition: transform var(--t-fast) var(--ease-out),
                  box-shadow var(--t-fast) var(--ease-out),
                  opacity 0.2s;
    }
    .nn-node:hover {
      transform: translateY(-2px);
      z-index: 10;
    }
    .nn-node:hover .nn-collapse-btn { opacity:0.8 !important; }
    .nn-node:hover .nn-card-actions { opacity:1 !important; }

    /* ── Node pop-in animation ── */
    @keyframes nn-node-in {
      from { opacity:0; transform:scale(0.88) translateY(4px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }
    .nn-node-new { animation: nn-node-in 160ms var(--ease-spring) forwards; }

    /* ── Panel slide-in ── */
    @keyframes nn-slide-in-right {
      from { opacity:0; transform:translateX(16px); }
      to   { opacity:1; transform:translateX(0); }
    }
    @keyframes nn-slide-in-up {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes nn-fade-in {
      from { opacity:0; }
      to   { opacity:1; }
    }
    .nn-panel-in { animation: nn-slide-in-right 180ms var(--ease-out) forwards; }
    .nn-modal-in { animation: nn-slide-in-up 200ms var(--ease-spring) forwards; }

    /* ── Collab / pulse animations ── */
    @keyframes nn-collab-pulse {
      0%,100% { box-shadow: 0 0 0 2px transparent; }
      50%      { box-shadow: 0 0 0 4px rgba(255,255,255,.15); }
    }
    @keyframes nn-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(123,140,255,.5); }
      50%      { box-shadow: 0 0 0 6px rgba(123,140,255,0); }
    }
    @keyframes nn-where-was-i {
      0%   { box-shadow: 0 0 0 0 rgba(123,140,255,.7); }
      50%  { box-shadow: 0 0 0 10px rgba(123,140,255,.15); }
      100% { box-shadow: 0 0 0 0 rgba(123,140,255,0); }
    }

    /* ── Canvas dot grid ── */
    .nn-canvas-grid {
      background-image: radial-gradient(circle, var(--canvas-dot) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }

    /* ── Canvas vignette ── */
    .nn-canvas-vignette::after {
      content:'';
      position:absolute;
      inset:0;
      pointer-events:none;
      background: radial-gradient(ellipse at center,
        transparent 60%,
        rgba(0,0,0,0.18) 100%);
      z-index:0;
    }

    /* ── Focus mode blur ── */
    .nn-focus-dim {
      filter: blur(1.5px);
      opacity: 0.12 !important;
      transition: filter 0.25s, opacity 0.25s;
    }
    .nn-focus-bright {
      filter: none;
      opacity: 1 !important;
    }

    /* ── Pill buttons ── */
    .nn-pill {
      border-radius: 99px !important;
      padding: 5px 14px !important;
    }

    /* ── "Where was I" last-edited pulse ── */
    .nn-last-edited {
      animation: nn-where-was-i 1.2s var(--ease-out) 3;
    }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
