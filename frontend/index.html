<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NodeMap</title>
  <style>
    :root {
      --bg:#0d1117; --bg2:#161b22; --bg3:#21262d;
      --border:#30363d; --border2:#21262d;
      --text:#e6edf3; --text2:#c9d1d9; --text3:#7d8590; --text4:#484f58;
      --accent:#58a6ff; --accent2:#1f6feb;
      --success:#3fb950; --danger:#f78166;
      --canvas-dot:#21262d; --node-bg:#161b22; --shadow:rgba(0,0,0,0.5);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; font-size: 13px; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    input, textarea, button, select { font-family: inherit; }
    button { transition: opacity .15s; }
    button:hover { opacity: .88; }
    button:disabled { opacity: .4; cursor: not-allowed !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
